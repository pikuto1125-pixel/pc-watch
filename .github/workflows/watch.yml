name: pc-watch
# PC（Hermes）の心拍を外から見る。心拍は PC が 5 分ごとに secret gist へ書く。
# 古ければ ntfy.sh に通知（同じ障害で 60 分に 1 回まで）。戻ったら「復旧」を 1 回。
# 公開 repo の標準ランナーは無料（GitHub Docs: Actions billing）。秘密値は Actions secrets（HB_GIST_ID・NTFY_TOPIC）。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      stale_minutes:
        description: "この分数より古い心拍を止まったとみなす（試験用に短くできる）"
        default: "20"
permissions:
  contents: read
concurrency:
  group: pc-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: check heartbeat
        env:
          GIST_ID: ${{ secrets.HB_GIST_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          STALE_MIN: ${{ inputs.stale_minutes || '20' }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, base64
          gist, topic = os.environ["GIST_ID"], os.environ["NTFY_TOPIC"]
          stale = float(os.environ.get("STALE_MIN") or 20) * 60
          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode()
          def ntfy(msg, title, prio, tags):
              t = "=?UTF-8?B?" + base64.b64encode(title.encode()).decode() + "?="
              req = urllib.request.Request(f"https://ntfy.sh/{topic}", data=msg.encode(), method="POST",
                                           headers={"Title": t, "Priority": prio, "Tags": tags})
              urllib.request.urlopen(req, timeout=20).read()
          g = json.loads(get(f"https://api.github.com/gists/{gist}",
                             {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}))
          hb = json.loads(g["files"]["heartbeat.json"]["content"])
          age = time.time() - float(hb.get("epoch") or 0)
          # 直近 3 時間の自分の通知（hb-down / hb-up）を ntfy から読む＝状態を持たずに重複を防ぐ
          last = None
          for line in get(f"https://ntfy.sh/{topic}/json?poll=1&since=3h").splitlines():
              m = json.loads(line)
              tags = m.get("tags") or []
              if m.get("event") == "message" and ("hb-down" in tags or "hb-up" in tags):
                  last = ("down" if "hb-down" in tags else "up", m["time"])
          mins = int(age // 60)
          print(f"heartbeat age={mins}min gateway={hb.get('gateway')} stale_limit={stale/60:.0f}min last_notice={last}")
          if age > stale:
              if not (last and last[0] == "down" and time.time() - last[1] < 3600):
                  ntfy(f"PC か Hermes が止まっている可能性。最後の心拍 {mins} 分前（{hb.get('ts')}）。"
                       f"停電・スリープ・ネット断・ゲートウェイ停止を確認。", "【監視】心拍途絶", "high", "hb-down,rotating_light")
                  print("notified: down")
          elif last and last[0] == "down":
              ntfy(f"心拍が戻った（{mins} 分前に受信、gateway={hb.get('gateway')}）。", "【監視】復旧", "default", "hb-up,white_check_mark")
              print("notified: up")
          elif hb.get("gateway") == "ng":
              print("PC は生きているが gateway=ng（PC 側の監視が知らせる）")
          PY
